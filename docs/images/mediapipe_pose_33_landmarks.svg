<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc">
<title id="title">MediaPipe Pose：人体とランドマーク番号（0〜32）</title><desc id="desc">正面から見た人物の模式図。人物の右が図の左、人物の左が図の右。顔と手は拡大して番号を示す。橙はアプリの角度計算に使う点、青は描画だけの点、灰はアプリで使わない点。実測座標ではない。</desc>
