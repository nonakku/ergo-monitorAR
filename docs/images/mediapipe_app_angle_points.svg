<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="title desc">
<title id="title">本アプリの角度計算に使うランドマーク</title><desc id="desc">肩11と12の中点S、腰23と24の中点Hを結ぶ線と鉛直との角度が体幹角度。左腰23、左膝25、左足首27の3点で左膝の内角を求める。中点SとHはMediaPipeの番号ではない。</desc>
<style>text{font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif;fill:#243449} .title{font-size:29px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.num{font-size:18px;font-weight:700;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style>
<rect width="1100" height="790" fill="white"/>
<text x="32" y="46" class="title" text-anchor="start">本アプリ：番号から角度へ</text>
<text x="32" y="82" class="label" text-anchor="start">計算に使う6点と、アプリが作る2つの中点。図の角度・位置は説明用。</text>
<line x1="440" y1="220" x2="260" y2="180" stroke="#adbac7" stroke-width="5" stroke-linecap="round"/>
<line x1="440" y1="220" x2="390" y2="400" stroke="#adbac7" stroke-width="5" stroke-linecap="round"/>
<line x1="260" y1="180" x2="260" y2="400" stroke="#adbac7" stroke-width="5" stroke-linecap="round"/>
<line x1="390" y1="400" x2="260" y2="400" stroke="#adbac7" stroke-width="5" stroke-linecap="round"/>
<line x1="390" y1="400" x2="445" y2="565" stroke="#adbac7" stroke-width="5" stroke-linecap="round"/>
<line x1="445" y1="565" x2="375" y2="720" stroke="#adbac7" stroke-width="5" stroke-linecap="round"/>
<circle data-landmark="12" cx="260" cy="180" r="7" fill="#bb4f00" stroke="white" stroke-width="2"/>
<text x="224" y="186" class="num" text-anchor="start" style="fill:#bb4f00">12</text>
<circle data-landmark="11" cx="440" cy="220" r="7" fill="#bb4f00" stroke="white" stroke-width="2"/>
<text x="456" y="226" class="num" text-anchor="start" style="fill:#bb4f00">11</text>
<circle data-landmark="24" cx="260" cy="400" r="7" fill="#bb4f00" stroke="white" stroke-width="2"/>
<text x="224" y="406" class="num" text-anchor="start" style="fill:#bb4f00">24</text>
<circle data-landmark="23" cx="390" cy="400" r="7" fill="#bb4f00" stroke="white" stroke-width="2"/>
<text x="406" y="406" class="num" text-anchor="start" style="fill:#bb4f00">23</text>
<circle data-landmark="25" cx="445" cy="565" r="7" fill="#bb4f00" stroke="white" stroke-width="2"/>
<text x="461" y="571" class="num" text-anchor="start" style="fill:#bb4f00">25</text>
<circle data-landmark="27" cx="375" cy="720" r="7" fill="#bb4f00" stroke="white" stroke-width="2"/>
<text x="391" y="726" class="num" text-anchor="start" style="fill:#bb4f00">27</text>
<line x1="325" y1="400" x2="325" y2="130" stroke="#697684" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="325" y1="400" x2="350" y2="200" stroke="#bb4f00" stroke-width="4" stroke-linecap="round"/>
<circle cx="350" cy="200" r="8" fill="white" stroke="#bb4f00" stroke-width="3"/>
<text x="366" y="188" class="heading" text-anchor="start" style="fill:#bb4f00">S</text>
<circle cx="325" cy="400" r="8" fill="white" stroke="#bb4f00" stroke-width="3"/>
<text x="341" y="388" class="heading" text-anchor="start" style="fill:#bb4f00">H</text>
<path d="M325 350 A50 50 0 0 1 331.2 350.4" fill="none" stroke="#bb4f00" stroke-width="4"/>
<text x="135" y="333" class="label" text-anchor="start" style="fill:#bb4f00">体幹角度 θ</text>
<line x1="253" y1="325" x2="327" y2="351" stroke="#bb4f00" stroke-width="1" stroke-linecap="round"/>
<path d="M432.35 527.05 A40 40 0 0 0 428.54 601.47" fill="none" stroke="#bb4f00" stroke-width="3"/>
<text x="92" y="570" class="label" text-anchor="start" style="fill:#bb4f00">左膝の内角 φ</text>
<line x1="256" y1="559" x2="405" y2="559" stroke="#bb4f00" stroke-width="1" stroke-linecap="round"/>
<text x="625" y="175" class="heading" text-anchor="start">① 肩の中点 S</text>
<text x="625" y="210" class="label" text-anchor="start">S.x = (点11.x + 点12.x) / 2</text>
<text x="625" y="240" class="label" text-anchor="start">S.y = (点11.y + 点12.y) / 2</text>
<text x="625" y="306" class="heading" text-anchor="start">② 腰の中点 H</text>
<text x="625" y="341" class="label" text-anchor="start">H.x = (点23.x + 点24.x) / 2</text>
<text x="625" y="371" class="label" text-anchor="start">H.y = (点23.y + 点24.y) / 2</text>
<text x="625" y="437" class="heading" text-anchor="start">③ 体幹角度 θ</text>
<text x="625" y="472" class="label" text-anchor="start">鉛直と H→S のなす角（9.1参照）</text>
<text x="625" y="506" class="label" text-anchor="start">calculateTrunkAngle(S, H)</text>
<text x="625" y="572" class="heading" text-anchor="start">④ 左膝の内角 φ</text>
<text x="625" y="607" class="label" text-anchor="start">点25を頂点に、25→23 と25→27</text>
<text x="625" y="641" class="label" text-anchor="start">calculateAngle(点23, 点25, 点27)</text>
<text x="625" y="697" class="label" text-anchor="start">θ・φ → 負荷 → スコア（9.2–9.5）</text>
<text x="32" y="763" class="small" text-anchor="start">S・Hは新しい番号の点ではない。x/yの正規化座標で計算する。左右反転・画素への換算は計算に使わない。</text>
</svg>
